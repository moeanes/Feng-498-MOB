# -------------------------------------------------------------------
# Monitoring Agent Configuration - EXAMPLE FILE
# -------------------------------------------------------------------
# Copy this file to agent.properties and fill in the real values.
# Do NOT commit agent.properties to source control.
# This example file (with placeholders) is safe to commit.
# -------------------------------------------------------------------

# Backend REST base URL — no trailing slash
agent.backend-url=https://feng-498-mob-production.up.railway.app

# UUID of this machine as registered in the backend
# Obtained from: POST /api/v1/machines
agent.machine-id=BURAYA_MACHINE_ID_GIR

# Plain token issued by the backend for this machine
# Obtained from: POST /api/v1/machines/{machineId}/tokens
# Shown only once — copy it immediately.
agent.machine-token=BURAYA_TOKEN_GIR

# How often (in seconds) to collect and send metrics
agent.interval-seconds=1
